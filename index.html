<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App Demo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #1e293b;
      color: #ffffff;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .badge {
      background: #38bdf8;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #334155;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background: #22c55e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
  <div class="badge">Telegram Mini App</div>
  <h2>Fast Food Delivery</h2>
  <p>Order pizza and drinks fast via Telegram bot.</p>
  
  <div class="product">
    <span>🍕 Pepperoni Pizza</span>
    <strong>$8.00</strong>
  </div>
  
  <button>Order Now</button>
</div>


</body>
</html>
